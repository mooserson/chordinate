databases:
  - name: chordinate-db
    plan: free
    databaseName: chordinate
    ipAllowList: []

services:
  - type: web
    name: chordinate
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chordinate-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
