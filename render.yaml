databases:
  - name: chordinate-db
    plan: free
    databaseName: chordinate
    ipAllowList: []

services:
  - type: web
    name: chordinate
    runtime: ruby
    plan: free
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chordinate-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
